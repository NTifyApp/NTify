syntax = "proto2";

package spotify.player.proto;

import "spotify/context_page.proto";
import "spotify/restrictions.proto";

option optimize_for = CODE_SIZE;
option java_package = "com.spotifyxp.deps.com.spotify.context";

message Context {
    optional string uri = 1;
    optional string url = 2;
    map<string, string> metadata = 3;
    optional Restrictions restrictions = 4;
    repeated ContextPage pages = 5;
    optional bool loading = 6;
}
